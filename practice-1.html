<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Страница со стихотворением и портретом автора"/>
    <title>Стихотворение</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <header>
        <h1>Незнакомка. Александр Блок</h1>
    </header>

    <p>
        По вечерам над ресторанами<br>
        Горячий воздух дик и глух,<br>
        И правит окриками пьяными<br>
        Весенний и тлетворный дух.<br>
        <br>
        Вдали над пылью переулочной,<br>
        Над скукой загородных дач,<br>
        Чуть золотится крендель булочной,<br>
        И раздается детский плач.
    </p>

    <img src="image.png" alt=" блок " width="250" height="320">
